# Temporary: installs the APK on an Android emulator, taps through, saves screenshots + logcat to a draft release.
name: apk-smoke
on:
  push:
    branches: [apk-smoke]
permissions:
  contents: write
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Join the APK
        run: cat test.apk.part* > test.apk && ls -la test.apk && mkdir -p out
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Emulator
        timeout-minutes: 30
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          profile: pixel_4
          ram-size: 4096M
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          disable-animations: true
          script: bash smoke.sh
      - name: Results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out || true
          [ -n "$(ls out)" ] || echo none > out/none.txt
          gh release create "smoke-${GITHUB_RUN_ID}" out/* --draft --title smoke --notes temp -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
