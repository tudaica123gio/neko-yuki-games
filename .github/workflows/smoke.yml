# Temporary: installs test.apk on Android emulators from 4.1 to 16, launches it, saves screenshots + logcat as artifacts.
name: apk-smoke
on:
  push:
    branches: [apk-smoke]
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        include:
          - { api: 16, target: default, arch: x86, gpu: guest }
          - { api: 19, target: default, arch: x86, gpu: guest }
          - { api: 21, target: default, arch: x86_64, gpu: swiftshader_indirect }
          - { api: 24, target: default, arch: x86_64, gpu: swiftshader_indirect }
          - { api: 28, target: default, arch: x86_64, gpu: swiftshader_indirect }
          - { api: 30, target: google_apis, arch: x86_64, gpu: swiftshader_indirect }
          - { api: 34, target: google_apis, arch: x86_64, gpu: swiftshader_indirect }
          - { api: 36, target: google_apis, arch: x86_64, gpu: swiftshader_indirect }
    steps:
      - uses: actions/checkout@v4
      - name: KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
          mkdir -p out
      - name: Emulator API ${{ matrix.api }}
        timeout-minutes: 40
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 1500
          emulator-options: -no-window -gpu ${{ matrix.gpu }} -noaudio -no-boot-anim -no-snapshot
          disable-animations: false
          script: bash smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-api${{ matrix.api }}
          path: out
